<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Firn: a six-armed snow crystal on a round field. -->
  <circle cx="256" cy="256" r="240" fill="#1d3b53"/>
  <g stroke="#e8f1f8" stroke-width="22" stroke-linecap="round" fill="none">
    <g id="arm">
      <line x1="256" y1="256" x2="256" y2="76"/>
      <polyline points="208,112 256,142 304,112"/>
    </g>
    <use href="#arm" transform="rotate(60 256 256)"/>
    <use href="#arm" transform="rotate(120 256 256)"/>
    <use href="#arm" transform="rotate(180 256 256)"/>
    <use href="#arm" transform="rotate(240 256 256)"/>
    <use href="#arm" transform="rotate(300 256 256)"/>
  </g>
</svg>
